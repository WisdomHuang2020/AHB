<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 996 540" width="996" height="540">
  <style>
    .w   { stroke:#000; stroke-width:2.2; fill:none; stroke-linecap:round; }
    .wc  { stroke:#000; stroke-width:2.5; fill:none; stroke-linecap:round; }
    .var { font: italic 26px Georgia, 'Times New Roman', serif; fill:#000; }
    .red { font: italic 26px Georgia, 'Times New Roman', serif; fill:#C00000; }
    .rs  { font: 28px Georgia, 'Times New Roman', serif; fill:#C00000; }
    .dot { fill:#000; }
    .arw { stroke:#C00000; stroke-width:2.5; fill:none; }
  </style>

  <rect x="0" y="0" width="996" height="540" fill="#ffffff"/>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C00000"/>
    </marker>
  </defs>

  <!-- ===== 左母线 + V_B 电压源 ===== -->
  <path class="w" d="M140,52 L384,52"/>
  <path class="w" d="M140,52 L140,182"/>
  <circle class="wc" cx="140" cy="236" r="54"/>
  <path class="w" d="M132,218 L148,218 M140,210 L140,226"/>
  <path class="w" d="M132,256 L148,256"/>
  <path class="w" d="M140,290 L140,416"/>
  <text class="var" x="78" y="246" text-anchor="end">V<tspan dy="6" font-size="65%">B</tspan></text>

  <!-- ===== 中间桥臂：两个 Coss 串联 ===== -->
  <path class="w" d="M384,52 L384,130"/>
  <path class="wc" d="M348,130 L420,130"/>
  <path class="wc" d="M348,154 L420,154"/>
  <path class="w" d="M384,154 L384,324"/>
  <path class="wc" d="M348,324 L420,324"/>
  <path class="wc" d="M348,348 L420,348"/>
  <path class="w" d="M384,348 L384,416"/>
  <circle class="dot" cx="384" cy="204" r="5"/>
  <text class="var" x="442" y="148">C<tspan dy="6" font-size="65%">oss</tspan></text>
  <text class="var" x="442" y="352">C<tspan dy="6" font-size="65%">oss</tspan></text>

  <!-- V_S2 标注（上管 Coss 两端，红色） -->
  <text class="rs" x="310" y="98">+</text>
  <text class="red" x="242" y="150">V<tspan dy="6" font-size="65%">S2</tspan></text>
  <text class="rs" x="312" y="200">&#8722;</text>

  <!-- ===== i_Lr 电流箭头 + Lr ===== -->
  <path class="arw" d="M408,204 L476,204" marker-end="url(#arr)"/>
  <text class="red" x="412" y="178">i<tspan dy="6" font-size="65%">Lr</tspan></text>
  <path class="w" d="M496,204 a18,18 0 0 1 36,0 a18,18 0 0 1 36,0 a18,18 0 0 1 36,0 a18,18 0 0 1 36,0"/>
  <path class="w" d="M640,204 L664,204"/>
  <circle class="dot" cx="664" cy="204" r="5"/>
  <text class="var" x="568" y="254" text-anchor="middle">L<tspan dy="6" font-size="65%">r</tspan></text>

  <!-- ===== Lm 竖直电感 ===== -->
  <path class="w" d="M664,204 a26.5,26.5 0 0 1 0,53 a26.5,26.5 0 0 1 0,53 a26.5,26.5 0 0 1 0,53 a26.5,26.5 0 0 1 0,53"/>
  <circle class="dot" cx="664" cy="416" r="5"/>
  <text class="var" x="618" y="324" text-anchor="end">L<tspan dy="6" font-size="65%">m</tspan></text>

  <!-- ===== Coss3/n^2 + nVo 回路 ===== -->
  <path class="w" d="M664,204 L708,204"/>
  <path class="wc" d="M720,168 L720,240"/>
  <path class="wc" d="M744,168 L744,240"/>
  <path class="w" d="M744,204 L830,204"/>
  <text class="var" x="732" y="144" text-anchor="middle">C<tspan dy="6" font-size="65%">oss3</tspan><tspan dy="-6">/n</tspan><tspan dy="-14" font-size="65%">2</tspan></text>

  <!-- nVo 电压源（上负下正） -->
  <path class="w" d="M830,204 L830,260"/>
  <circle class="wc" cx="830" cy="314" r="54"/>
  <path class="w" d="M822,296 L838,296"/>
  <path class="w" d="M822,334 L838,334 M830,326 L830,342"/>
  <path class="w" d="M830,368 L830,416"/>
  <text class="var" x="898" y="324">nV<tspan dy="6" font-size="65%">o</tspan></text>

  <!-- ===== 底母线 + V_Cr 电压源（左负右正） ===== -->
  <path class="w" d="M140,416 L424,416"/>
  <circle class="wc" cx="476" cy="416" r="52"/>
  <path class="w" d="M446,408 L446,424"/>
  <path class="w" d="M498,408 L498,424 M490,416 L506,416"/>
  <path class="w" d="M528,416 L830,416"/>
  <text class="var" x="476" y="500" text-anchor="middle">V<tspan dy="6" font-size="65%">Cr</tspan></text>
</svg>
