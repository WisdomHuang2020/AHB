<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <style>
    .w   { stroke:#000; stroke-width:2.2; fill:none; stroke-linecap:round; }
    .wc  { stroke:#000; stroke-width:2.5; fill:none; stroke-linecap:round; }
    .var { font: italic 26px Georgia, 'Times New Roman', serif; fill:#000; }
    .red { font: italic 26px Georgia, 'Times New Roman', serif; fill:#C00000; }
    .rs  { font: 28px Georgia, 'Times New Roman', serif; fill:#C00000; }
    .dot { fill:#000; }
    .arw { stroke:#C00000; stroke-width:2.5; fill:none; }
  </style>

  <rect x="0" y="0" width="960" height="540" fill="#ffffff"/>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C00000"/>
    </marker>
  </defs>

  <!-- ===== 左母线 + V_B 电压源 ===== -->
  <path class="w" d="M140,52 L380,52"/>
  <path class="w" d="M140,52 L140,188"/>
  <circle class="wc" cx="140" cy="240" r="52"/>
  <path class="w" d="M132,222 L148,222 M140,214 L140,230"/>
  <path class="w" d="M132,258 L148,258"/>
  <path class="w" d="M140,292 L140,420"/>
  <text class="var" x="78" y="250" text-anchor="end">V<tspan dy="6" font-size="65%">B</tspan></text>

  <!-- ===== 中间桥臂：两个 Coss 串联 ===== -->
  <path class="w" d="M380,52 L380,126"/>
  <path class="wc" d="M344,126 L416,126"/>
  <path class="wc" d="M344,150 L416,150"/>
  <path class="w" d="M380,150 L380,328"/>
  <path class="wc" d="M344,328 L416,328"/>
  <path class="wc" d="M344,352 L416,352"/>
  <path class="w" d="M380,352 L380,420"/>
  <circle class="dot" cx="380" cy="204" r="5"/>
  <text class="var" x="438" y="150">C<tspan dy="6" font-size="65%">oss</tspan></text>
  <text class="var" x="438" y="352">C<tspan dy="6" font-size="65%">oss</tspan></text>

  <!-- V_S2 标注（上管 Coss 两端，红色） -->
  <text class="rs" x="306" y="112">+</text>
  <text class="red" x="238" y="148">V<tspan dy="6" font-size="65%">S2</tspan></text>
  <text class="rs" x="308" y="196">&#8722;</text>

  <!-- ===== 节点到 Lr 的黑色横线（连续完整） ===== -->
  <path class="w" d="M380,204 L496,204"/>

  <!-- i_Lr 红色箭头叠加在黑线上方（上偏 4px） -->
  <path class="arw" d="M404,200 L470,200" marker-end="url(#arr)"/>
  <text class="red" x="408" y="180">i<tspan dy="6" font-size="65%">Lr</tspan></text>

  <!-- ===== Lr 电感 ===== -->
  <path class="w" d="M496,204 a18,18 0 0 1 36,0 a18,18 0 0 1 36,0 a18,18 0 0 1 36,0 a18,18 0 0 1 36,0"/>
  <path class="w" d="M640,204 L664,204"/>
  <circle class="dot" cx="664" cy="204" r="5"/>
  <text class="var" x="568" y="252" text-anchor="middle">L<tspan dy="6" font-size="65%">r</tspan></text>

  <!-- ===== Lm 竖直电感 ===== -->
  <path class="w" d="M664,204 a27,27 0 0 1 0,54 a27,27 0 0 1 0,54 a27,27 0 0 1 0,54 a27,27 0 0 1 0,54"/>
  <circle class="dot" cx="664" cy="420" r="5"/>
  <text class="var" x="618" y="322" text-anchor="end">L<tspan dy="6" font-size="65%">m</tspan></text>

  <!-- ===== Coss3/n^2 + nVo 回路 ===== -->
  <path class="w" d="M664,204 L712,204"/>
  <path class="wc" d="M724,170 L724,238"/>
  <path class="wc" d="M748,170 L748,238"/>
  <path class="w" d="M748,204 L830,204"/>
  <text class="var" x="736" y="146" text-anchor="middle">C<tspan dy="6" font-size="65%">oss3</tspan><tspan dy="-6">/n</tspan><tspan dy="-14" font-size="65%">2</tspan></text>

  <!-- nVo 电压源（上负下正） -->
  <path class="w" d="M830,204 L830,262"/>
  <circle class="wc" cx="830" cy="314" r="52"/>
  <path class="w" d="M822,296 L838,296"/>
  <path class="w" d="M822,334 L838,334 M830,326 L830,342"/>
  <path class="w" d="M830,366 L830,420"/>
  <text class="var" x="896" y="326">nV<tspan dy="6" font-size="65%">o</tspan></text>

  <!-- ===== 底母线（连续完整）+ V_Cr 电压源（左负右正） ===== -->
  <path class="w" d="M140,420 L422,420"/>
  <circle class="wc" cx="472" cy="420" r="50"/>
  <path class="w" d="M444,412 L444,428"/>
  <path class="w" d="M498,412 L498,428 M490,420 L506,420"/>
  <path class="w" d="M522,420 L830,420"/>
  <text class="var" x="472" y="504" text-anchor="middle">V<tspan dy="6" font-size="65%">Cr</tspan></text>
</svg>
