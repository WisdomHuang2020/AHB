  <path class="wc" d="M390,262 a10,10 0 0 1 20,0 a10,10 0 0 1 20,0 a10,10 0 0 1 20,0 a10,10 0 0 1 20,0"/>
  <text class="var" x="415" y="240">L<tspan dy="6" font-size="65%">r</tspan></text>
  <path class="w" d="M470,262 L640,262"/>
  <circle class="dot" cx="500" cy="262" r="4"/>

