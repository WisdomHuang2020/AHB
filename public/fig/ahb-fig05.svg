  <text class="var" x="18" y="272">V<tspan dy="6" font-size="65%">in</tspan></text>

  <!-- 半桥竖母线 -->
  <path class="w" d="M290,78 L290,450"/>

  <!-- ============ S1 MOSFET(关断,全部灰色) ============ -->
  <path class="wg" d="M290,165 L264,165"/>
