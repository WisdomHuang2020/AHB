  <circle class="dot" cx="925" cy="450" r="4"/>
  <text class="var" x="866" y="384">C<tspan dy="6" font-size="65%">o</tspan></text>

  <!-- 负载 -->
  <path class="w" d="M1065,262 L1065,290"/>
  <rect x="1052" y="290" width="26" height="110" fill="#fff" stroke="#000" stroke-width="2.2"/>
  <path class="w" d="M1065,400 L1065,450"/>
  <circle class="dot" cx="1065" cy="450" r="4"/>
  <text class="var" x="1080" y="306">+</text>
  <text class="var" x="1080" y="414">−</text>
  <text class="var" x="1080" y="362">V<tspan dy="6" font-size="65%">o</tspan></text>

  <!-- 其余节点 -->
  <circle class="dot" cx="290" cy="450" r="4"/>

  <!-- ============ 阶段3 电流路径高亮(红色虚线) ============ -->
  <!-- Ilr 回路: 顶边+右竖+底边+左边短竖(顶端向上箭头, 经S2体二极管回Vmid), 左上开口 -->
  <path class="wr" d="M310,278 L466,278 Q478,278 478,290 L478,400 Q478,412 466,412 L354,412 Q342,412 342,400 L342,322"/>
  <polygon class="arr" points="336,322 348,322 342,296"/>
  <text class="varr" x="400" y="330">I<tspan dy="6" font-size="65%">lr</tspan></text>
  <!-- Ilm 励磁电流(向下) -->
  <path class="wr" d="M575,288 L575,386"/>
  <polygon class="arr" points="569,386 581,386 575,402"/>
  <text class="varr" x="592" y="302">I<tspan dy="6" font-size="65%">lm</tspan></text>
  <!-- Vlm 极性: 上-下+ -->
  <text class="varr" x="520" y="242">−</text>
  <text class="varr" x="548" y="234">V<tspan dy="6" font-size="65%">lm</tspan></text>
  <text class="varr" x="520" y="486">+</text>
  <!-- Id 副边回路: 贴副绕组右缘左竖(顶端向上箭头)+顶边+右竖(穿Io环内)+底边, 包围Co -->
  <path class="wr" d="M705,405 L705,322 M705,296 L705,293 Q705,285 713,285 L998,285 Q1010,285 1010,297 L1010,393 Q1010,405 998,405 L705,405"/>
  <polygon class="arr" points="699,322 711,322 705,296"/>
  <text class="varr" x="735" y="390">I<tspan dy="6" font-size="65%">d</tspan></text>
  <!-- Io 输出回路: Co右侧小环, 左边一个向上箭头 -->
  <path class="wr" d="M963,292 Q955,292 955,300 L955,318 M955,346 L955,410 Q955,418 963,418 L1032,418 Q1040,418 1040,410 L1040,300 Q1040,292 1032,292 L963,292"/>
  <polygon class="arr" points="949,346 961,346 955,320"/>
  <text class="varr" x="986" y="344">I<tspan dy="6" font-size="65%">O</tspan></text>

  <!-- 图题 -->
  <text class="cn" x="565" y="568" text-anchor="middle">(c) 阶段3（<tspan font-style="italic" font-family="Georgia,serif">t</tspan><tspan dy="6" font-size="70%" font-style="italic" font-family="Georgia,serif">2</tspan><tspan dy="-6">~</tspan><tspan font-style="italic" font-family="Georgia,serif">t</tspan><tspan dy="6" font-size="70%" font-style="italic" font-family="Georgia,serif">3</tspan><tspan dy="-6">）</tspan></text>
</svg>
