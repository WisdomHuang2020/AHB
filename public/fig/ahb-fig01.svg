<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1108 520" width="1108" height="520">
  <style>
    .w   { stroke:#000; stroke-width:2.2; fill:none; stroke-linecap:round; }
    .wc  { stroke:#000; stroke-width:2.5; fill:none; stroke-linecap:round; }
    .var { font: italic 22px Georgia, 'Times New Roman', serif; fill:#000; }
    .cn  { font: 20px 'Microsoft YaHei', 'SimHei', sans-serif; fill:#000; }
    .gnd { font: 18px 'Microsoft YaHei', 'SimHei', sans-serif; fill:#000; }
    .box { fill:none; stroke:#8B3A3A; stroke-width:1.8; stroke-dasharray:7 5; }
    .lbl { fill:#fff; stroke:#666; stroke-width:1; }
    .dot { fill:#000; }
  </style>

  <!-- 白底 -->
  <rect x="0" y="0" width="1108" height="520" fill="#ffffff"/>

  <!-- ============ 虚线框 ============ -->
  <rect class="box" x="28"   y="18"  width="316" height="464" rx="12"/>
  <rect class="box" x="352"  y="200" width="224" height="282" rx="12"/>
  <rect class="box" x="590"  y="148" width="150" height="334" rx="12"/>
  <rect class="box" x="755"  y="148" width="232" height="334" rx="12"/>
  <rect class="box" x="1000" y="148" width="102" height="334" rx="12"/>

  <!-- 框标签(白底) -->
  <rect class="lbl" x="70"   y="28"  width="180" height="32"/>
  <text class="cn" x="160" y="51" text-anchor="middle">方波产生器</text>

  <rect class="lbl" x="418"  y="206" width="140" height="32"/>
  <text class="cn" x="488" y="229" text-anchor="middle">谐振网络</text>

  <rect class="lbl" x="614"  y="154" width="106" height="82"/>
  <text class="cn" x="667" y="178" text-anchor="middle" font-size="19">理想</text>
  <text class="cn" x="667" y="204" text-anchor="middle" font-size="19">变压</text>
  <text class="cn" x="667" y="230" text-anchor="middle" font-size="19">器</text>

  <rect class="lbl" x="810"  y="158" width="146" height="32"/>
  <text class="cn" x="883" y="181" text-anchor="middle">整流网络</text>

  <rect class="lbl" x="1022" y="158" width="66"  height="32"/>
  <text class="cn" x="1055" y="181" text-anchor="middle">负载</text>

  <!-- ============ 方波产生器 ============ -->
  <!-- 顶母线 -->
  <path class="w" d="M75,78 L290,78"/>
  <!-- 左竖线 + Vin 电压源 -->
  <path class="w" d="M75,78 L75,236"/>
  <path class="w" d="M75,288 L75,450"/>
  <circle class="wc" cx="75" cy="262" r="26"/>
  <path class="w" d="M69,248 L81,248 M75,242 L75,254"/>
  <path class="w" d="M69,278 L81,278"/>
  <text class="var" x="24" y="270">V<tspan dy="6" font-size="65%">in</tspan></text>

  <!-- Cin 支路 -->
  <path class="w" d="M135,78 L135,240"/>
  <path class="wc" d="M118,242 L152,242"/>
  <path class="wc" d="M118,256 L152,256"/>
  <path class="w" d="M135,256 L135,450"/>
  <text class="var" x="96" y="252">C<tspan dy="6" font-size="65%">in</tspan></text>

  <!-- PGND 接地 -->
  <path class="w" d="M135,450 L135,456"/>
  <path class="wc" d="M123,458 L147,458"/>
  <path class="wc" d="M128,464 L142,464"/>
  <path class="wc" d="M133,470 L137,470"/>
  <text class="gnd" x="30" y="486">PGND</text>

  <!-- 半桥竖母线 -->
  <path class="w" d="M290,78 L290,450"/>

  <!-- S1 MOSFET (漏 y=165, 源 y=235, 栅 y=200) -->
  <path class="w" d="M290,165 L264,165"/>
  <path class="w" d="M290,235 L264,235"/>
  <path class="wc" d="M264,160 L264,185 M264,192 L264,218 M264,225 L264,240"/>
  <path class="wc" d="M256,175 L256,225"/>
  <path class="w" d="M256,200 L175,200"/>
  <!-- 体二极管 + 寄生电容并联盒 -->
  <path class="w" d="M290,165 L334,165 L334,235 L290,235"/>
  <path class="w" d="M303,165 L303,181"/>
  <polygon points="295,197 311,197 303,181" fill="#000"/>
  <path class="wc" d="M295,181 L311,181"/>
  <path class="w" d="M303,197 L303,235"/>
  <path class="w" d="M322,165 L322,192"/>
  <path class="wc" d="M313,194 L331,194"/>
  <path class="wc" d="M313,204 L331,204"/>
  <path class="w" d="M322,204 L322,235"/>
  <text class="var" x="190" y="180">S<tspan dy="6" font-size="65%">1</tspan></text>

  <!-- S2 MOSFET (漏 y=330, 源 y=400, 栅 y=365) -->
  <path class="w" d="M290,330 L264,330"/>
  <path class="w" d="M290,400 L264,400"/>
  <path class="wc" d="M264,325 L264,350 M264,357 L264,383 M264,390 L264,405"/>
  <path class="wc" d="M256,340 L256,390"/>
  <path class="w" d="M256,365 L175,365"/>
  <path class="w" d="M290,330 L334,330 L334,400 L290,400"/>
  <path class="w" d="M303,330 L303,346"/>
  <polygon points="295,362 311,362 303,346" fill="#000"/>
  <path class="wc" d="M295,346 L311,346"/>
  <path class="w" d="M303,362 L303,400"/>
  <path class="w" d="M322,330 L322,357"/>
  <path class="wc" d="M313,359 L331,359"/>
  <path class="wc" d="M313,369 L331,369"/>
  <path class="w" d="M322,369 L322,400"/>
  <text class="var" x="190" y="350">S<tspan dy="6" font-size="65%">2</tspan></text>

  <!-- Vmid 节点 -->
  <circle class="dot" cx="290" cy="262" r="4"/>
  <text class="var" x="208" y="292">V<tspan dy="6" font-size="65%">mid</tspan></text>

  <!-- ============ 谐振网络 ============ -->
  <!-- Vmid -> Lr -->
  <path class="w" d="M290,262 L390,262"/>
  <!-- Lr 线圈(4 个半圆弧,向上凸) -->
  <path class="wc" d="M390,262 a10,10 0 0 1 20,0 a10,10 0 0 1 20,0 a10,10 0 0 1 20,0 a10,10 0 0 1 20,0"/>
  <text class="var" x="415" y="308">L<tspan dy="6" font-size="65%">r</tspan></text>
  <!-- Lr -> 节点A -> 变压器原边 -->
  <path class="w" d="M470,262 L640,262"/>
  <circle class="dot" cx="500" cy="262" r="4"/>
  <!-- Ip 电流箭头 -->
  <polygon points="518,256 518,268 534,262" fill="#000"/>
  <text class="var" x="542" y="290">I<tspan dy="6" font-size="65%">p</tspan></text>

  <!-- Lm 纵向支路 -->
  <path class="w" d="M500,262 L500,305"/>
  <path class="wc" d="M500,305 a11,11 0 0 1 0,20 a11,11 0 0 1 0,20 a11,11 0 0 1 0,20 a11,11 0 0 1 0,20"/>
  <path class="w" d="M500,385 L500,450"/>
  <circle class="dot" cx="500" cy="450" r="4"/>
  <!-- Ilm 向下箭头(在线圈上方导线上) -->
  <polygon points="493,282 507,282 500,298" fill="#000"/>
  <text class="var" x="446" y="304">I<tspan dy="6" font-size="65%">lm</tspan></text>
  <text class="var" x="458" y="362">L<tspan dy="6" font-size="65%">m</tspan></text>
  <text class="var" x="528" y="364">n</text>

  <!-- 底部回线(PGND -> Cr -> SGND) -->
  <path class="w" d="M75,450 L455,450"/>
  <path class="w" d="M472,450 L1065,450"/>
  <!-- Cr 串联在底部回线上 -->
  <path class="wc" d="M455,433 L455,467"/>
  <path class="wc" d="M472,433 L472,467"/>
  <text class="var" x="486" y="440">C<tspan dy="6" font-size="65%">r</tspan></text>
  <!-- Ilr 向左箭头 -->
  <polygon points="430,444 430,456 412,450" fill="#000"/>
  <text class="var" x="372" y="436">I<tspan dy="6" font-size="65%">lr</tspan></text>

  <!-- ============ 理想变压器 ============ -->
  <!-- 原边绕组(向左凸) -->
  <path class="w" d="M640,262 L640,287"/>
  <path class="wc" d="M640,287 a10.7,10.7 0 0 0 0,21.4 a10.7,10.7 0 0 0 0,21.4 a10.7,10.7 0 0 0 0,21.4 a10.7,10.7 0 0 0 0,21.4 a10.7,10.7 0 0 0 0,21.4 a10.7,10.7 0 0 0 0,21.4"/>
  <path class="w" d="M640,415 L640,450"/>
  <circle class="dot" cx="640" cy="450" r="4"/>
  <!-- 铁芯 -->
  <path class="wc" d="M655,282 L655,418"/>
  <path class="wc" d="M663,282 L663,418"/>
  <!-- 副边绕组(向右凸) -->
  <path class="w" d="M676,262 L676,287"/>
  <path class="wc" d="M676,287 a10.7,10.7 0 0 1 0,21.4 a10.7,10.7 0 0 1 0,21.4 a10.7,10.7 0 0 1 0,21.4 a10.7,10.7 0 0 1 0,21.4 a10.7,10.7 0 0 1 0,21.4 a10.7,10.7 0 0 1 0,21.4"/>
  <path class="w" d="M676,415 L676,450"/>
  <circle class="dot" cx="676" cy="450" r="4"/>
  <!-- 同名端 * -->
  <text x="618" y="296" font="24px Georgia, serif" fill="#000">*</text>
  <text x="646" y="474" font="24px Georgia, serif" fill="#000">*</text>
  <text class="var" x="614" y="474">T</text>
  <!-- 副边回路标注 l -->
  <text class="var" x="700" y="346">l</text>

  <!-- ============ 整流网络 ============ -->
  <!-- Id 电流箭头 -->
  <polygon points="704,256 704,268 720,262" fill="#000"/>
  <text class="var" x="692" y="292">I<tspan dy="6" font-size="65%">d</tspan></text>
  <!-- 顶部线 + D1 -->
  <path class="w" d="M676,262 L820,262"/>
  <polygon points="820,250 820,274 848,262" fill="#000"/>
  <path class="wc" d="M848,248 L848,276"/>
  <path class="w" d="M848,262 L1065,262"/>
  <text class="var" x="820" y="298">D<tspan dy="6" font-size="65%">1</tspan></text>

  <!-- Co 支路 -->
  <circle class="dot" cx="925" cy="262" r="4"/>
  <path class="w" d="M925,262 L925,364"/>
  <path class="wc" d="M905,366 L945,366"/>
  <path class="wc" d="M905,380 L945,380"/>
  <path class="w" d="M925,380 L925,450"/>
  <circle class="dot" cx="925" cy="450" r="4"/>
  <text class="var" x="866" y="384">C<tspan dy="6" font-size="65%">o</tspan></text>

  <!-- ============ 负载 ============ -->
  <!-- Io 电流箭头 -->
  <polygon points="1026,256 1026,268 1042,262" fill="#000"/>
  <text class="var" x="1004" y="244">I<tspan dy="6" font-size="65%">O</tspan></text>
  <!-- 负载电阻 -->
  <path class="w" d="M1065,262 L1065,290"/>
  <rect x="1052" y="290" width="26" height="110" fill="#fff" stroke="#000" stroke-width="2.2"/>
  <path class="w" d="M1065,400 L1065,450"/>
  <circle class="dot" cx="1065" cy="450" r="4"/>
  <!-- Vo 标注 -->
  <text class="var" x="1082" y="304" font-size="20">+</text>
  <text class="var" x="1082" y="412" font-size="20">−</text>
  <text class="var" x="1082" y="360">V<tspan dy="6" font-size="65%">o</tspan></text>

  <!-- SGND 接地 -->
  <path class="w" d="M1065,450 L1065,456"/>
  <path class="wc" d="M1053,458 L1077,458"/>
  <path class="wc" d="M1058,464 L1072,464"/>
  <path class="wc" d="M1063,470 L1067,470"/>
  <text class="gnd" x="1022" y="490">SGND</text>

  <!-- 其余节点 -->
  <circle class="dot" cx="135" cy="78" r="4"/>
  <circle class="dot" cx="290" cy="450" r="4"/>
</svg>
